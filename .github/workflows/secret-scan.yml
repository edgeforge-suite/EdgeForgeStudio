name: Secret Scan

# Import-gate G3: a named secret scanner (gitleaks) runs on every PR and on push
# to main, so known credential patterns are blocked before merge. Uses the pinned
# gitleaks CLI (no marketplace action / org license needed, so it stays portable
# into an adopting organization). Confirmed false positives, if any, are
# allowlisted in .gitleaks.toml with justification (none today). Evidence:
# docs/handover-evidence/secret-and-data-scan.md.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan committed files for secrets
        # Scans the current committed tree against gitleaks' default ruleset plus
        # the repo's .gitleaks.toml allowlist. --redact keeps any match out of the
        # logs; non-zero exit fails the job (and the PR).
        run: gitleaks dir . --no-banner --redact --exit-code 1
