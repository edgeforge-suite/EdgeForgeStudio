[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0", "packaging==26.2"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeforge-studio"
version = "5.0.0"
description = "EdgeForge Studio - local FastAPI authoring companion for reviewed EdgeForge manifest packages."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Santosh Hommaradi" },
]
dependencies = [
    "fastapi==0.138.1",
    "starlette==1.3.1",
    "uvicorn[standard]>=0.35,<1",
    "jinja2==3.1.6",
    "python-multipart==0.0.31",
    "pyyaml==6.0.2",
    "ruamel.yaml==0.19.1",
    "pydantic==2.11.7",
    "fastmcp==3.4.10",
    "httpx==0.28.1",
    "jsonschema>=4.23,<5",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "httpx2==2.12.0",
    "pip-audit==2.9.0",
    "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/edgeforge-suite/EdgeForgeStudio"
Repository = "https://github.com/edgeforge-suite/EdgeForgeStudio"
Issues = "https://github.com/edgeforge-suite/EdgeForgeStudio/issues"

[project.scripts]
edgeforge-studio = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: focused smoke harness tests that are runnable on demand",
    "l2: Studio shared-mode two-session smoke harness",
    "l4: Studio-to-Engine-to-KS cross-repo author-generate + KS isolation smoke",
    "l5: Studio acceptance driver - composes the Studio-owned L5 scenarios for the suite orchestrator",
    "regen: Studio-to-Engine regen Change-Plan smoke",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP017", "UP045"]

[tool.ruff.lint.per-file-ignores]
"app/routes/knowledge.py" = ["B008"]
"app/routes/project_file.py" = ["B008"]
"app/routes/upstream.py" = ["B008"]
"scripts/proof_run_*.py" = ["E402"]
"tests/test_openapi_service.py" = ["E402"]
